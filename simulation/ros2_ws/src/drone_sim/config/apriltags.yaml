family: tag36h11
size_m: 0.070               # black square edge (what apriltag_ros needs)
outer_size_m: 0.0875        # PNG extent incl. 1-cell white border
thickness_m: 0.001
texture_dir: models/apriltags/textures   # relative to the package share dir (parent of config/) or absolute
# Extra yaw (rad) applied to the tag visual only. Artwork-up must point to world +X; verified by render check.
texture_yaw_offset_rad: 3.141592653589793   # render-checked (progress.md): 0 gave artwork-up = world -X
# apriltag_ros v3.2.x parameter names (verified in src/AprilTagNode.cpp)
max_hamming: 0
pose_estimation_method: pnp       # "pnp" or "homography"
detector: {threads: 2, decimate: 1.0, blur: 0.0, refine: true, sharpening: 0.25, debug: false}
detection_frame_prefix: apriltag_det_   # tag.frames = prefix + id (avoids clashing with apriltag_gt_<id>)
# World frame: origin = track centre (checkpoint 6) = centre of the UWB cube floor face.
# world x = track-frame x (tag_layout.csv) - 5.0 m.
tags:
  - {name: left_1,  id: 0, checkpoint: 1, x: -5.0, y: 0.20}
  - {name: right_1, id: 1, checkpoint: 1, x: -5.0, y: -0.20}
  - {name: left_2,  id: 2, checkpoint: 2, x: -4.0, y: 0.20}
  - {name: right_2, id: 3, checkpoint: 2, x: -4.0, y: -0.20}
