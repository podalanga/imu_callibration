x_left: -5.75
x_right: 5.75
y: 0.0
n_traversals: 5                 # 2.5 rounds (round = there and back); the first goes left -> right, directions alternate
v_cruise: 0.3                   # slow, constant over ~96% of each 11.5 m pass
a_max: 0.3
takeoff_v: 0.4
takeoff_a: 0.3
