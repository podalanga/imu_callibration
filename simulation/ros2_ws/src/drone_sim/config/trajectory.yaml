takeoff_settle_s: 5.0           # hover after takeoff until the camera height has settled at 1.10 m
pos_tol_m: 0.05                 # along-track error at segment end
vel_tol_mps: 0.05
land_at_finish: false
land_v: 0.3
land_a: 0.3
land_height_margin_m: 0.03      # final camera height above its on-ground height
