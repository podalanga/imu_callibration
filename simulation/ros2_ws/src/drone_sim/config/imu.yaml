rate_hz: 200
ideal_topic: /imu/ideal
noisy_topic: /imu/noisy
ideal_frame_id: imu_ideal_link
noisy_frame_id: imu_noisy_link
# ideal: no <noise> elements at all.
# noisy: gz-sensors gaussian noise, same parameters applied to x, y, z of each channel.
noisy:
  gyro:                          # rad/s
    mean: 0.0
    stddev: 0.002
    bias_mean: 0.0
    bias_stddev: 0.0005
    dynamic_bias_stddev: 1.0e-05
    dynamic_bias_correlation_time: 300.0
  accel:                         # m/s^2
    mean: 0.0
    stddev: 0.02
    bias_mean: 0.0
    bias_stddev: 0.02
    dynamic_bias_stddev: 5.0e-04
    dynamic_bias_correlation_time: 300.0
