# Mission node + PX4 interface.
rate_hz: 50                         # TrajectorySetpoint / OffboardControlMode publish rate (must be >= 10 for PX4)
odom_topic: /ground_truth/odom      # world ENU pose, twist in body (FLU) frame
pose_topic: /ground_truth/pose
status_topic: /controller/status
reference_topic: /trajectory/reference
odom_twist_in_body: true            # verified: gz OdometryPublisher twist is in the body frame (3D)
status_decimation: 5                # publish status/reference every N steps
px4:
  ns: /fmu
  offboard_control_mode_topic: /fmu/in/offboard_control_mode
  trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
  vehicle_command_topic: /fmu/in/vehicle_command
  visual_odometry_topic: /fmu/in/vehicle_visual_odometry
  vehicle_status_topic: /fmu/out/vehicle_status_v1       # VehicleStatus MESSAGE_VERSION = 1 -> _v1 suffix (v1.16)
  local_position_topic: /fmu/out/vehicle_local_position
  qos_out: {reliability: best_effort, durability: transient_local, depth: 1}  # as in the PX4 offboard example
  offboard_warmup_s: 2.0            # stream setpoints this long before requesting OFFBOARD
  command_retry_s: 1.0              # re-send OFFBOARD/ARM until vehicle_status confirms
  target_system: 1
  target_component: 1
  source_system: 1
  source_component: 1
  require_status: true              # wait for vehicle_status (+ valid local position) before commanding (false: command blindly)
  require_local_position: true      # also wait for vehicle_local_position xy_valid and z_valid (EKF2 aligned on EV)
  ev_ready_s: 3.0                   # minimum time after the first GT sample before commanding (blind mode and margin)
  # nav_state 14 = NAVIGATION_STATE_OFFBOARD, arming_state 2 = ARMED
  nav_state_offboard: 14
  arming_state_armed: 2
  # extra feedback on top of PX4's own position loop (0 = pure feedforward setpoints)
  extra_kp_xy: 0.0
  extra_kp_z: 0.0
  yaw_enu_rad: 0.0
ev:                                 # gt_to_px4_ev_node
  rate_hz: 50
  position_variance: 1.0e-4         # m^2
  orientation_variance: 1.0e-4      # rad^2
  velocity_variance: 1.0e-4         # (m/s)^2
  quality: 100
  # PX4 SITL with gz uses the sim clock for its time base: timestamps = sim time in microseconds.
  use_sim_time_us: true
